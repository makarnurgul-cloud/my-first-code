<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топтық резюме</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; }
        .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #333;
            transition: 0.3s;
            cursor: pointer;
            padding: 20px;
        }
        .nurgul-card { background-color: #f4f6f9; border-right: 2px solid #ccc; }
        .asel-card { background-color: #eef7f2; }
        .card:hover { transform: scale(1.02); opacity: 0.9; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 3px solid #fff; }
        h1 { font-size: 32px; margin-bottom: 10px; }
        p { font-size: 18px; color: #666; }
        .btn { margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <a href="nurgul.html" class="card nurgul-card">
        <img src="https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png" alt="Макар Нұргүл" class="avatar">
        <h1>Макар Нұргүл</h1>
        <p>IT Specialist / Software Engineer</p>
        <div class="btn">Резюмені қарау</div>
    </a>

    <a href="asel.html" class="card asel-card">
        <img src="https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png" alt="Халел Әсел" class="avatar">
        <h1>Халел Әсел</h1>
        <p>UI/UX Designer / Frontend Developer</p>
        <div class="btn">Резюмені қарау</div>
    </a>

</body>
</html>
